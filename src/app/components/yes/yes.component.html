<div class="container">
  <div class="confetti"></div>
  
  <div class="card">
    <div class="header-emoji">🎉 ❤️ 🎊</div>
    
    <h1 class="title">You said Yes! 💕</h1>
    
    <div class="gif-container">
      <img 
        src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExczR2MTF3MjNwdmtyb2xrZXNybHA5cHFtbW10enVxdmlia3VleHhyZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/pLed7SanSDQziJ81ZP/giphy.gif" 
        alt="celebration"
        class="gif"
      >
    </div>
    
    <div class="message">
      <p class="message-text">
        You've just made me the happiest person! 🌹
      </p>
      <p class="message-subtext">
        This is just the beginning of something beautiful. Thank you for saying yes!
      </p>
    </div>
    
    <div class="image-placeholder">
      <img 
        src="assets/valentines-gift.jpeg"
        alt="our-photo"
        class="personal-image"
      >
    </div>
    
    <button class="btn-back" (click)="goBack()">
      ← Back to Home
    </button>
    
    <div class="hearts-floating">
      <span class="heart" style="--delay: 0s">❤️</span>
      <span class="heart" style="--delay: 0.5s">💕</span>
      <span class="heart" style="--delay: 1s">💖</span>
      <span class="heart" style="--delay: 1.5s">💗</span>
      <span class="heart" style="--delay: 2s">💝</span>
    </div>
  </div>
</div>
